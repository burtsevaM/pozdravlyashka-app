<section class="page-header">
  <p class="eyebrow">MVP-панель</p>
  <h1>Главная панель</h1>
  <p>Короткий обзор ближайших поздравлений, подарков, голосований и напоминаний.</p>
</section>

<section class="dashboard-grid" aria-label="Сводка">
  @for (card of cards; track card.title) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-icon mat-card-avatar aria-hidden="true">{{ card.icon }}</mat-icon>
        <mat-card-title>{{ card.title }}</mat-card-title>
        <mat-card-subtitle>{{ card.subtitle }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ card.description }}</p>
      </mat-card-content>
    </mat-card>
  }
</section>

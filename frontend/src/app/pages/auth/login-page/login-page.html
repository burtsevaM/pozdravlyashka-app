<main class="auth-page">
  <mat-card appearance="outlined" class="auth-panel">
    <mat-card-header>
      <div mat-card-avatar class="auth-icon">
        <mat-icon aria-hidden="true">login</mat-icon>
      </div>
      <mat-card-title>Вход</mat-card-title>
      <mat-card-subtitle>Поздравляшка</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <mat-error>Введите корректный email</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Пароль</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <mat-error>Минимум 6 символов</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting()">
          Войти
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a mat-button routerLink="/register">Зарегистрироваться</a>
    </mat-card-actions>
  </mat-card>
</main>
